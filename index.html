<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚗️ CATALYST LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--card:#0d1421;--alt:#111d2e;--border:#1e3a5f;--blue:#0ea5e9;--purple:#a855f7;--green:#22c55e;--red:#ef4444;--yellow:#eab308;--orange:#f97316;--tp:#e2e8f0;--tm:#8193ab;--tc:#7dd3fc;--mono:'JetBrains Mono',monospace;--body:'Inter',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tp);font-family:var(--body);min-height:100vh;overflow-x:hidden;font-size:14px}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
a{color:var(--tc)}
button{font-family:inherit}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:rgba(8,12,20,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:0 18px;height:48px}
.wordmark{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--blue);white-space:nowrap;letter-spacing:.05em}
.tape-wrap{overflow:hidden;position:relative;height:48px;display:flex;align-items:center}
.tape-wrap::before,.tape-wrap::after{content:'';position:absolute;top:0;bottom:0;width:36px;z-index:1;pointer-events:none}
.tape-wrap::before{left:0;background:linear-gradient(to right,rgba(8,12,20,1),transparent)}
.tape-wrap::after{right:0;background:linear-gradient(to left,rgba(8,12,20,1),transparent)}
.tape{display:flex;gap:7px;animation:scroll 70s linear infinite;white-space:nowrap}
.tape:hover{animation-play-state:paused}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:4px;font-family:var(--mono);font-size:10px;border:1px solid var(--border);white-space:nowrap;cursor:pointer}
.pill.idea{border-style:dashed}
.pill-hot{border-color:rgba(234,179,8,.6);background:rgba(234,179,8,.08)}
.pill .sym{font-weight:700;color:var(--tc)}
.pill .dim{color:var(--tm);font-size:9px}
.nav-r{display:flex;align-items:center;gap:8px;white-space:nowrap}
.clock{font-family:var(--mono);font-size:10px;color:var(--tm)}
.live{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;font-weight:600}
.live-dot{width:6px;height:6px;border-radius:50%;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.icon-btn{background:none;border:1px solid var(--border);color:var(--tm);cursor:pointer;padding:4px 9px;border-radius:5px;font-size:12px;transition:all .2s;text-decoration:none;font-family:var(--mono)}
.icon-btn:hover{color:var(--tp);border-color:var(--blue)}

/* VIEW TABS */
.vtabs{display:flex;gap:2px;padding:0 14px;overflow-x:auto;border-top:1px solid rgba(30,58,95,.5)}
.vtab{background:none;border:none;border-bottom:2px solid transparent;color:var(--tm);padding:10px 14px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.vtab:hover{color:var(--tp)}
.vtab.active{color:var(--tp);border-bottom-color:var(--blue)}
.vtab .cnt{font-family:var(--mono);font-size:10px;background:var(--alt);border:1px solid var(--border);border-radius:9px;padding:0 6px;color:var(--tm)}
.vtab .cnt.warn{color:var(--orange);border-color:rgba(249,115,22,.5)}

/* LAYOUT */
.wrap{padding:20px 18px 40px;max-width:1500px;margin:0 auto}
.sec{margin-bottom:24px}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{font-size:22px;font-weight:700;margin-bottom:4px}
.page-h p{color:var(--tm);font-size:13px;max-width:820px;line-height:1.55}
.sec-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.sec-dot{width:5px;height:5px;border-radius:50%;background:var(--blue);flex-shrink:0}
.sec-title{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--tm)}
.sec-sub{font-size:12px;color:var(--tm);margin-left:auto}
.box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px}
.note{font-size:12px;color:var(--tm);line-height:1.55}
.asof{font-family:var(--mono);font-size:10px;color:var(--tm);background:var(--alt);border:1px solid var(--border);border-radius:5px;padding:4px 9px}

/* ACTION LIST */
.act-list{display:flex;flex-direction:column;gap:8px}
.act-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:8px;padding:11px 14px}
.act-item.sev-red{border-left-color:var(--red)}
.act-item.sev-orange{border-left-color:var(--orange)}
.act-item.sev-green{border-left-color:var(--green)}
.act-item.sev-grey{border-left-color:var(--tm)}
.act-ico{font-size:18px;width:26px;text-align:center}
.act-t{font-weight:600;font-size:13.5px;margin-bottom:2px}
.act-t .tk{font-family:var(--mono);color:var(--tc)}
.act-d{font-size:12px;color:var(--tm);line-height:1.5}
.act-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.stat-val{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--tp);line-height:1.1;margin-bottom:4px}
.stat-lbl{font-size:11px;color:var(--tm)}

/* TIMELINE */
.tl-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;overflow-x:auto}
.tl-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--tm);margin-top:6px}
.tl-legend span{display:inline-flex;align-items:center;gap:5px}
.lg-dot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* UPCOMING LIST / CALENDAR */
.ev-list{display:flex;flex-direction:column}
.ev-row{display:grid;grid-template-columns:96px 64px 70px 1fr auto;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid rgba(30,58,95,.45);font-size:13px;cursor:pointer}
.ev-row:hover{background:rgba(14,165,233,.04)}
.ev-row:last-child{border-bottom:none}
.ev-date{font-family:var(--mono);font-size:11px;color:var(--tm)}
.ev-days{font-family:var(--mono);font-size:11px;font-weight:700}
.ev-tk{font-family:var(--mono);font-weight:700;color:var(--tc)}
.ev-lbl{line-height:1.4}
.own{font-family:var(--mono);font-size:9px;padding:2px 7px;border-radius:9px;border:1px solid var(--border);color:var(--tm);white-space:nowrap}
.own.mine{color:var(--green);border-color:rgba(34,197,94,.4)}
.own.idea{color:var(--purple);border-color:rgba(168,85,247,.4)}
.cal-month{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin:18px 0 6px}
.cal-month:first-child{margin-top:0}

/* TOOLBAR */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .lbl{font-size:12px;color:var(--tm)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.seg button{background:none;border:none;color:var(--tm);padding:5px 11px;font-size:12px;cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:none}
.seg button.on{background:rgba(14,165,233,.15);color:var(--tp)}

/* CARDS */
.pos-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:10px;border-left:3px solid var(--green);overflow:hidden;scroll-margin-top:120px;display:flex;flex-direction:column}
.pcard.flash-card{box-shadow:0 0 0 2px var(--blue)}
.pcard.urg-yellow{border-left-color:var(--yellow)}
.pcard.urg-orange{border-left-color:var(--orange)}
.pcard.urg-red{border-left-color:var(--red)}
.pcard.urg-past,.pcard.urg-tbd{border-left-color:var(--tm)}
.pcard.idea-card{border-left-color:var(--purple)}
.ch{padding:13px 15px 10px}
.ch-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ticker{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--tc);letter-spacing:.04em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.co-name{font-size:12px;color:var(--tm);margin-top:1px}
.drug-line{font-size:12.5px;color:var(--tp);margin-top:6px;line-height:1.45}
.drug-line .ind{color:var(--tm)}
.badges{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.badge{padding:3px 9px;border-radius:10px;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.bp{background:rgba(14,165,233,.15);color:var(--blue);border:1px solid rgba(14,165,233,.3)}
.bph{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid rgba(168,85,247,.3)}
.ba{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3)}
.be{background:rgba(234,179,8,.15);color:var(--yellow);border:1px solid rgba(234,179,8,.3)}
.bo{background:rgba(100,116,139,.15);color:var(--tm);border:1px solid rgba(100,116,139,.3)}
.st-won{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.35)}
.st-failed{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.35)}
.st-delayed{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.35)}
.st-reclassify{background:rgba(100,116,139,.18);color:var(--tp);border:1px solid rgba(100,116,139,.4)}
.st-tracking{background:rgba(168,85,247,.15);color:var(--purple);border:1px solid rgba(168,85,247,.35)}

/* SUMMARY STRIP */
.sum{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:rgba(0,0,0,.15)}
.sum>div{padding:9px 12px;border-right:1px solid rgba(30,58,95,.6)}
.sum>div:last-child{border-right:none}
.sum .k{font-size:10.5px;color:var(--tm);margin-bottom:3px;white-space:nowrap}
.sum .v{font-family:var(--mono);font-size:14px;font-weight:700;white-space:nowrap}
.verdict{display:flex;align-items:center;gap:8px;padding:9px 15px;font-size:12.5px;border-bottom:1px solid var(--border);line-height:1.45}
.verdict .vd{font-weight:700;white-space:nowrap}
.v-strong{color:var(--green)}.v-pos{color:var(--tc)}.v-marg{color:var(--yellow)}.v-neg{color:var(--red)}
.outcome{padding:11px 15px;border-bottom:1px solid var(--border);font-size:12.5px;line-height:1.55}
.outcome .ot{font-weight:700;margin-bottom:3px}
.outcome.o-won{background:rgba(34,197,94,.07)}.outcome.o-won .ot{color:var(--green)}
.outcome.o-failed{background:rgba(239,68,68,.07)}.outcome.o-failed .ot{color:var(--red)}
.outcome.o-delayed{background:rgba(249,115,22,.07)}.outcome.o-delayed .ot{color:var(--orange)}
.outcome.o-reclassify{background:rgba(100,116,139,.08)}.outcome.o-reclassify .ot{color:var(--tp)}
.outcome .nx{color:var(--tm);margin-top:5px}
.outcome .nx b{color:var(--tp);font-weight:600}

/* CARD TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:9px 12px;font-size:12px;font-weight:500;color:var(--tm);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;flex:1;white-space:nowrap}
.tab:hover{color:var(--tp)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tcon{display:none;padding:14px 15px;flex:1}
.tcon.active{display:block}

/* DATA CELLS */
.dg{display:grid;gap:7px;margin-bottom:9px}
.dg4{grid-template-columns:repeat(4,1fr)}
.dg3{grid-template-columns:repeat(3,1fr)}
.dg2{grid-template-columns:repeat(2,1fr)}
.dc{background:var(--alt);border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.dc-lbl{font-size:10.5px;color:var(--tm);margin-bottom:3px}
.dc-val{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--tp)}
.pos{color:var(--green)}.neg{color:var(--red)}
.act{display:inline-block;padding:3px 10px;border-radius:4px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-top:7px}
.act-run{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.act-trail{background:rgba(234,179,8,.15);color:var(--yellow);border:1px solid rgba(234,179,8,.3)}
.act-hold{background:rgba(14,165,233,.15);color:var(--blue);border:1px solid rgba(14,165,233,.3)}
.act-rev{background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3)}
.act-cut{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}
.prog{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:4px}
.prog-fill{height:100%;border-radius:2px}
.act-expl{font-size:12px;color:var(--tm);margin-top:6px;line-height:1.5}

/* CATALYST */
.cdate-box{padding:12px;background:var(--alt);border-radius:8px;border:1px solid var(--border);margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:16px}
.cdate-main{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--tp)}
.cdown{font-family:var(--mono);font-size:21px;font-weight:700}
.cdown-lbl{font-size:10.5px;color:var(--tm);margin-top:2px}
.pathway-badge{display:inline-block;padding:2px 8px;border-radius:4px;font-family:var(--mono);font-size:9.5px;background:rgba(14,165,233,.1);color:var(--blue);border:1px solid rgba(14,165,233,.25);margin-top:5px}
.prob-panel{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--alt);border-radius:8px;border:1px solid var(--border);padding:12px;margin-bottom:12px}
.ev-num{font-family:var(--mono);font-size:22px;font-weight:700;margin-bottom:2px}
.ev-lbl{font-size:11px;color:var(--tm);margin-bottom:8px}
.tgt-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgt-item .lbl{font-size:10.5px;color:var(--tm);display:block;margin-bottom:2px}
.tgt-item .val{font-family:var(--mono);font-size:12.5px;font-weight:600}
.pencil-btn{background:none;border:1px solid var(--border);color:var(--tm);cursor:pointer;padding:3px 8px;border-radius:4px;font-size:11px;transition:all .2s}
.pencil-btn:hover{color:var(--blue);border-color:var(--blue)}
.rr-badge{display:inline-block;padding:1px 7px;border-radius:3px;font-family:var(--mono);font-size:11px;font-weight:700}
.rr-good{background:rgba(34,197,94,.15);color:var(--green);border:1px solid rgba(34,197,94,.3)}
.rr-ok{background:rgba(234,179,8,.15);color:var(--yellow);border:1px solid rgba(234,179,8,.3)}
.rr-poor{background:rgba(239,68,68,.15);color:var(--red);border:1px solid rgba(239,68,68,.3)}

/* SCENARIOS */
.scen-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.scen{border-radius:8px;padding:10px;border:1px solid}
.scen-bull{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.28)}
.scen-base{background:rgba(234,179,8,.06);border-color:rgba(234,179,8,.28)}
.scen-bear{background:rgba(239,68,68,.06);border-color:rgba(239,68,68,.28)}
.scen-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;font-weight:700}
.scen-bull .scen-lbl{color:var(--green)}.scen-base .scen-lbl{color:var(--yellow)}.scen-bear .scen-lbl{color:var(--red)}
.scen-what{font-size:11.5px;color:var(--tp);line-height:1.45;margin-bottom:7px;min-height:32px}
.scen-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;margin-top:2px}
.scen-row .k{color:var(--tm)}
.scen-price{font-family:var(--mono);font-size:15px;font-weight:700;margin:3px 0}
.whatif{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--tm);margin-bottom:10px}
.whatif input{width:100px;background:var(--alt);border:1px solid var(--border);border-radius:5px;padding:5px 8px;color:var(--tp);font-family:var(--mono);font-size:12px;outline:none}
.whatif input:focus{border-color:var(--blue)}
.ref-note{font-size:11px;color:var(--tm);margin-bottom:10px;line-height:1.5}

/* REVIEW STATUS & KEY DATES */
.rev-box{background:var(--alt);border:1px solid var(--border);border-radius:7px;padding:9px 11px;margin-bottom:10px}
.rev-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.rev-txt{font-size:12.5px;color:var(--tp);line-height:1.55}
.kd-list{margin-bottom:12px;list-style:none}
.kd-item{display:flex;align-items:flex-start;gap:9px;padding:6px 0;border-bottom:1px solid rgba(30,58,95,.4);font-size:12.5px}
.kd-item:last-child{border-bottom:none}
.kd-icon{flex-shrink:0;font-size:11px;margin-top:2px}
.kd-date{font-family:var(--mono);font-size:11px;color:var(--tm);min-width:92px;margin-top:1px}
.kd-label{color:var(--tp);line-height:1.45}

/* EDITOR */
.ped{background:var(--alt);border:1px solid var(--blue);border-radius:8px;padding:12px;margin-bottom:12px;display:none}
.ped.open{display:block}
.ped-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.sl-row{margin-bottom:10px}
.sl-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--tm);margin-bottom:4px}
.sl-val{color:var(--tp);font-weight:600;font-family:var(--mono)}
input[type=range]{width:100%;height:3px;background:var(--border);border-radius:2px;outline:none;-webkit-appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--blue);cursor:pointer;box-shadow:0 0 0 2px rgba(14,165,233,.3)}
.ped-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}

/* THESIS */
.thesis-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
.thesis-txt{font-size:13px;line-height:1.6;color:var(--tp);background:var(--alt);padding:10px 12px;border-radius:7px;border-left:2px solid var(--blue);margin-bottom:12px}
.risks-txt{border-left-color:var(--red)}
.green-txt{border-left-color:var(--green)}
.purple-txt{border-left-color:var(--purple)}
ul.bul{padding-left:18px;margin:0}
ul.bul li{margin-bottom:5px}
ul.bul li:last-child{margin-bottom:0}
.crit{display:flex;gap:6px;flex-wrap:wrap;padding:0 15px 12px}
.crit span{font-size:11px;padding:3px 9px;border-radius:12px;border:1px solid var(--border);color:var(--tm);white-space:nowrap}
.crit span.ok{color:var(--green);border-color:rgba(34,197,94,.35)}
.crit span.bad{color:var(--orange);border-color:rgba(249,115,22,.4)}
.plan-grid{display:grid;grid-template-columns:140px 1fr;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px}
.plan-grid>div{padding:9px 11px;font-size:12.5px;line-height:1.5;border-bottom:1px solid rgba(30,58,95,.5)}
.plan-grid>div:nth-last-child(-n+2){border-bottom:none}
.plan-grid .pk{background:var(--alt);color:var(--tm);font-weight:600;font-size:12px}
.src{font-size:11.5px;line-height:1.7}
.src a{color:var(--tc);text-decoration:none}
.src a:hover{text-decoration:underline}
.chk-title{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tm);margin-bottom:7px;margin-top:12px}
.chk-item{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px;color:var(--tm);cursor:pointer;user-select:none}
.chk-item input{width:14px;height:14px;accent-color:var(--blue);cursor:pointer}
.chk-item.done{color:var(--green);text-decoration:line-through}
.jrnl-area textarea{width:100%;background:var(--alt);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--tp);font-family:var(--body);font-size:12.5px;resize:vertical;min-height:58px;outline:none}
.jrnl-area textarea:focus{border-color:var(--blue)}
.jrnl-entries{margin-top:9px}
.jrnl-entry{background:var(--alt);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:6px}
.jrnl-time{font-family:var(--mono);font-size:9.5px;color:var(--tm);margin-bottom:3px}
.jrnl-txt{font-size:12.5px;color:var(--tp);line-height:1.5;white-space:pre-wrap}

/* FOOTER */
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 15px;border-top:1px solid var(--border);background:rgba(0,0,0,.18);flex-wrap:wrap}
.cfoot-ts{font-family:var(--mono);font-size:9.5px;color:var(--tm)}
.cfoot-acts{display:flex;gap:6px;flex-wrap:wrap}
.decision-note{font-size:11.5px;color:var(--tm);margin-top:4px}

/* BUTTONS */
.btn{padding:6px 12px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .2s;white-space:nowrap}
.btn-p{background:var(--blue);color:#001018}
.btn-p:hover{opacity:.85}
.btn-s{background:var(--card);border:1px solid var(--border);color:var(--tp)}
.btn-s:hover{border-color:var(--tm)}
.btn-d{background:rgba(239,68,68,.12);border:1px solid var(--red);color:var(--red)}
.btn-d:hover{background:rgba(239,68,68,.22)}
.btn-g{background:rgba(34,197,94,.12);border:1px solid var(--green);color:var(--green)}
.btn-pu{background:rgba(168,85,247,.14);border:1px solid var(--purple);color:#d8b4fe}
.btn-sm{padding:4px 9px;font-size:11px}

/* PERF */
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px}
th{text-align:left;padding:6px 9px;color:var(--tm);font-size:10.5px;font-weight:600;border-bottom:1px solid var(--border)}
td{padding:8px 9px;border-bottom:1px solid rgba(30,58,95,.3);color:var(--tp)}
tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto}
.panels{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.panel-hd{padding:11px 15px;border-bottom:1px solid var(--border);background:rgba(0,0,0,.18)}
.panel-title{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--tm)}
.panel-body{padding:14px 15px}
.risk-bar-row{margin-bottom:9px}
.rb-lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--tm);margin-bottom:4px}
.rb{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.rb-fill{height:100%;border-radius:3px}
.corr-warn{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:7px;padding:9px 11px;font-size:12px;color:#fca5a5;margin-bottom:8px;line-height:1.5}
.info-warn{background:rgba(234,179,8,.07);border:1px solid rgba(234,179,8,.3);border-radius:7px;padding:10px 12px;font-size:12.5px;color:#fde68a;margin-bottom:14px;line-height:1.55}

/* GUIDE */
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gl{display:grid;grid-template-columns:150px 1fr;gap:0}
.gl>div{padding:8px 0;border-bottom:1px solid rgba(30,58,95,.45);font-size:12.5px;line-height:1.55}
.gl .term{font-family:var(--mono);font-weight:700;color:var(--tc);font-size:12px;padding-right:10px}
.steps{counter-reset:s;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 34px;font-size:13px;line-height:1.55}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:rgba(14,165,233,.15);border:1px solid rgba(14,165,233,.4);color:var(--blue);font-family:var(--mono);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps li b{color:var(--tp)}
.steps li span{color:var(--tm)}

/* MODALS */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-ov.hidden{display:none}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;max-width:560px;width:92%;max-height:88vh;overflow-y:auto;position:relative}
.modal-title{font-size:16px;font-weight:700;color:var(--tp);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border);padding-right:30px}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:1px solid var(--border);color:var(--tm);cursor:pointer;width:28px;height:28px;border-radius:5px;font-size:13px}
.modal-close:hover{color:var(--tp)}
.dstep{margin-bottom:14px;padding:12px;background:var(--alt);border-radius:8px;border:1px solid var(--border)}
.dstep-num{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.dstep-q{font-size:13px;font-weight:500;color:var(--tp);margin-bottom:8px}
.d-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--tp);font-family:var(--mono);font-size:12px;outline:none}
.d-input:focus{border-color:var(--blue)}
.d-warn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:5px;padding:8px 10px;font-size:12px;color:#fca5a5;margin-top:8px}
.d-info{background:rgba(14,165,233,.08);border:1px solid rgba(14,165,233,.2);border-radius:5px;padding:8px 10px;font-size:12px;color:var(--tc);margin-top:8px;line-height:1.5}
.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.choice-btn{padding:8px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;border:1px solid;background:none}
.choice-btn.chosen{box-shadow:0 0 0 2px currentColor}
.toggle-row{display:flex;gap:8px;flex-wrap:wrap}
.tog-btn{padding:6px 13px;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:none;color:var(--tm)}
.tog-btn.active{background:rgba(14,165,233,.15);color:var(--blue);border-color:var(--blue)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* SETTINGS */
.sett-panel{position:fixed;top:0;right:0;width:320px;max-width:100%;height:100vh;background:var(--card);border-left:1px solid var(--border);z-index:150;transform:translateX(100%);transition:transform .3s ease;overflow-y:auto;padding:18px}
.sett-panel.open{transform:translateX(0)}
.sett-title{font-size:14px;font-weight:700;color:var(--tp);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.sett-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--tm);cursor:pointer;font-size:16px}
.sett-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(30,58,95,.3)}
.sett-lbl{font-size:13px;color:var(--tp)}
.sett-desc{font-size:11px;color:var(--tm);margin-top:1px}
.tog{position:relative;width:36px;height:20px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tog-sl{position:absolute;inset:0;background:var(--border);border-radius:10px;cursor:pointer;transition:background .2s}
.tog-sl::before{content:'';position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .2s}
.tog input:checked+.tog-sl{background:var(--blue)}
.tog input:checked+.tog-sl::before{transform:translateX(16px)}
select.sett-sel{background:var(--alt);border:1px solid var(--border);color:var(--tp);font-size:12px;padding:5px 8px;border-radius:5px;outline:none;cursor:pointer}
.sett-version{font-family:var(--mono);font-size:10px;color:var(--tm);margin-top:14px;padding-top:10px;border-top:1px solid var(--border);line-height:1.7}
.sett-actions{display:flex;flex-direction:column;gap:7px;margin-top:14px}
#import-file{display:none}

/* SHORTCUTS */
.shorts-ov{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:300;display:flex;align-items:center;justify-content:center}
.shorts-ov.hidden{display:none}
.shorts-box{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;width:400px;max-width:92%}
.shorts-title{font-size:14px;font-weight:700;color:var(--tp);margin-bottom:14px;text-align:center}
.sk-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(30,58,95,.3);font-size:13px}
.sk-row:last-child{border-bottom:none}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 7px;background:var(--alt);border:1px solid var(--border);border-radius:4px;font-family:var(--mono);font-size:11px;color:var(--tc)}

@keyframes ring-pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ring-pulse{animation:ring-pulse 1s ease-in-out infinite}
.stale{background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.25);border-radius:4px;padding:3px 9px;font-family:var(--mono);font-size:9.5px;color:var(--yellow)}
body.privacy .blur-it{filter:blur(6px);user-select:none}
.empty{text-align:center;color:var(--tm);font-size:13px;padding:28px 12px}

/* RESPONSIVE */
@media(max-width:1200px){.stat-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1000px){.pos-grid{grid-template-columns:1fr}.guide-grid{grid-template-columns:1fr}}
@media(max-width:768px){
  .wrap{padding:14px 16px 32px}
  .nav-top{grid-template-columns:auto auto;justify-content:space-between;padding:0 12px}
  .tape-wrap{display:none}
  .clock{display:none}
  .vtabs{padding:0 6px}
  .vtab{padding:9px 10px;font-size:12.5px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .panels{grid-template-columns:1fr}
  .dg4{grid-template-columns:repeat(2,1fr)}
  .scen-grid{grid-template-columns:1fr}
  .scen-what{min-height:0}
  .sum{grid-template-columns:repeat(3,1fr)}
  .sum>div:nth-child(3){border-right:none}
  .sum>div:nth-child(n+4){border-top:1px solid rgba(30,58,95,.6)}
  .prob-panel{grid-template-columns:1fr}
  .act-item{grid-template-columns:auto 1fr}
  .act-btns{grid-column:1/-1;justify-content:flex-start}
  .ev-row{grid-template-columns:80px 50px 1fr;row-gap:2px}
  .ev-row .ev-tk{grid-column:3;grid-row:1}
  .ev-row .ev-lbl{grid-column:1/-1}
  .ev-row .own{display:none}
  .plan-grid{grid-template-columns:1fr}
  .plan-grid .pk{border-bottom:none!important;padding-bottom:2px}
  .gl{grid-template-columns:1fr}
  .gl .term{border-bottom:none;padding-bottom:0}
  .frow{grid-template-columns:1fr}
  .page-h h1{font-size:19px}
}
</style>
</head>

function closedSet(){return new Set(S.closed.map(c=>c.ticker));}
function myPositions(){
  const cs=closedSet();

  const tr=Object.values(S.tracked).filter(t=>!cs.has(t.ticker)).map(t=>{const i=CONFIG.ideas.find(x=>x.ticker===t.ticker);return i?{...i,isIdea:false,fromIdea:true,status:'active',shares:t.shares,avgCost:t.avgCost,stopPct:t.stopPct??0.30,entryDate:t.entryDate}:null;}).filter(Boolean);
  return[...base,...tr];
}
function ideaList(){return CONFIG.ideas;}
function findItem(t){return myPositions().find(p=>p.ticker===t)||CONFIG.ideas.find(i=>i.ticker===t)||CONFIG.positions.find(p=>p.ticker===t);}
function effPos(pos){const ov=S.overrides[pos.ticker]||{};return{...pos,myProbability:ov.myProbability??pos.myProbability,upside:ov.upside??pos.upside,downside:ov.downside??pos.downside};}
function scen(ep){
  const s=ep.scenarios;
  if(s){const tot=s.bull.p+s.base.p,share=tot>0?s.bull.p/tot:1;
    return{bull:{...s.bull,p:ep.myProbability*share,pct:ep.upside},base:{...s.base,p:ep.myProbability*(1-share)},bear:{...s.bear,p:1-ep.myProbability,pct:-ep.downside}};}
  return{bull:{p:ep.myProbability,pct:ep.upside,what:'Approval / positive data'},base:null,bear:{p:1-ep.myProbability,pct:-ep.downside,what:'Rejection / negative data'}};
}
function calcEV(ep){const s=scen(ep);return s.bull.p*s.bull.pct+(s.base?s.base.p*s.base.pct:0)+s.bear.p*s.bear.pct;}
function rrOf(ep){return ep.downside>0?ep.upside/ep.downside:99;}
function rrCls(r){return r>=2?'rr-good':r>=1.2?'rr-ok':'rr-poor';}
function price(t){return S.prices[t]?.price??null;}
function refPx(p){return price(p.ticker)??p.refPrice??null;}
function posVal(pos){const p=price(pos.ticker);return(p??pos.avgCost)*pos.shares;}
function totalCap(){return myPositions().reduce((s,p)=>s+posVal(p),0);}
function verdict(ev,rr){
  if(ev>=15&&rr>=1.2)return{t:'Strong setup',c:'v-strong',d:'Clearly positive expected value. Worth a full catalyst-sized position.'};
  if(ev>=5)return{t:'Positive EV',c:'v-pos',d:'The odds favor you, but not by a lot. Size normally or a bit smaller.'};
  if(ev>=0)return{t:'Marginal',c:'v-marg',d:'Roughly break-even at these estimates. Watch it, or only enter on a better price.'};
  return{t:'Negative EV',c:'v-neg',d:'At these estimates you expect to lose money. Avoid it, or exit before the event.'};
}

const PROXIES=[u=>u,u=>'https://corsproxy.io/?url='+encodeURIComponent(u),u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)];
let goodProxy=null;
async function getJSON(url){
  const order=goodProxy!=null?[goodProxy,...PROXIES.map((_,i)=>i).filter(i=>i!==goodProxy)]:PROXIES.map((_,i)=>i);
  for(const i of order){try{const r=await fetch(PROXIES[i](url),{signal:AbortSignal.timeout(8000)});if(!r.ok)continue;const j=await r.json();goodProxy=i;return j;}catch{}}
  return null;
}
function allSyms(){return[...new Set([...myPositions().map(p=>p.ticker),...CONFIG.ideas.map(i=>i.ticker)])];}
async function fetchPrices(){
  if(S.fetching)return false;S.fetching=true;
  const syms=allSyms();let got=0;const fresh=new Set();
  try{
    const j=await getJSON('https://query1.finance.yahoo.com/v7/finance/quote?symbols='+encodeURIComponent(syms.join(',')));
    (j?.quoteResponse?.result||[]).forEach(q=>{if(q.regularMarketPrice!=null){S.prices[q.symbol]={price:q.regularMarketPrice,change:q.regularMarketChange,changePct:q.regularMarketChangePercent,prevClose:q.regularMarketPreviousClose};fresh.add(q.symbol);got++;}});
    if(got<syms.length){
      const todo=syms.filter(t=>!fresh.has(t));let idx=0;
      const worker=async()=>{while(idx<todo.length){const t=todo[idx++];const c=await getJSON(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(t)}?range=5d&interval=1d`);const m=c?.chart?.result?.[0]?.meta;if(m&&m.regularMarketPrice!=null){const cl=(c.chart.result[0].indicators?.quote?.[0]?.close||[]).filter(x=>x!=null);const pc=m.previousClose??(cl.length>1?cl[cl.length-2]:m.chartPreviousClose);S.prices[t]={price:m.regularMarketPrice,prevClose:pc,change:pc?m.regularMarketPrice-pc:null,changePct:pc?(m.regularMarketPrice-pc)/pc*100:null};got++;}if(got===0&&idx>=4)return;}};
      await Promise.all([worker(),worker(),worker(),worker()]);
    }
  }catch{}
  S.fetching=false;
  if(got>0){S.staleData=false;S.lastFetch=new Date();lsSet('prices',{prices:S.prices,ts:S.lastFetch.toISOString()});return true;}
  const c=lsGet('prices',null);if(c?.prices){S.prices=c.prices;S.staleData=true;S.lastFetch=new Date(c.ts);}
  return false;
}

}

  let fill='';if(prob>=.01){const p=Math.min(prob,.9995),a=Math.PI*(1-p),ex=(cx+r*Math.cos(a)).toFixed(2),ey=(cy-r*Math.sin(a)).toFixed(2);fill=`<path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 0 ${ex} ${ey}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"/>`;}
  return`<svg viewBox="0 0 200 108" style="width:160px;display:block;margin:0 auto"><path d="M ${cx-r} ${cy} A ${r} ${r} 0 0 0 ${cx+r} ${cy}" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="${sw}" stroke-linecap="round"/>${fill}<text x="${cx}" y="${cy-18}" text-anchor="middle" fill="${col}" font-family="JetBrains Mono,monospace" font-size="28" font-weight="700">${Math.round(prob*100)}%</text><text x="${cx}" y="${cy-3}" text-anchor="middle" fill="rgba(129,147,171,.9)" font-family="Inter,sans-serif" font-size="9">chance it works</text></svg>`;
}

function upcomingEvents(includePast){

// ---------- Position tab ----------
function actionBadge(pos,px){
  if(!isActive(pos))return{t:{won:'TAKE PROFIT',failed:'EXIT',delayed:'DECIDE',reclassify:'RECLASSIFY'}[pos.status],c:{won:'act-run',failed:'act-cut',delayed:'act-rev',reclassify:'act-hold'}[pos.status],x:'The catalyst has resolved. See the next step above.'};
  if(!px)return{t:'HOLD',c:'act-hold',x:'Waiting for live price.'};
  const stop=pos.avgCost*(1-pos.stopPct),dist=(px-stop)/px,ret=(px-pos.avgCost)/pos.avgCost,d=daysTo(pos.catalystDate);
  if(px<=stop)return{t:'CUT',c:'act-cut',x:'Price is at or below your stop. Your pre-set rule says exit unless the thesis has improved.'};
  if(dist<0.05)return{t:'REVIEW',c:'act-rev',x:'Within 5% of your stop. Re-check the thesis.'};
  if(ret>0.5)return{t:'TRAIL STOP',c:'act-trail',x:'Up 50%+. Consider raising your stop to lock in gains before the event.'};
  if(d!=null&&d>=0&&d<=7)return{t:'HOLD',c:'act-hold',x:'Decision within a week. Stick to your plan; avoid emotional changes.'};
  if(ret>0.1)return{t:'LET RUN',c:'act-run',x:'Working. No action needed.'};
  return{t:'HOLD',c:'act-hold',x:'Nothing to do until the catalyst.'};
}
function posTab(pos,ep){

  const ret=px?(px-pos.avgCost)/pos.avgCost*100:null,pnl=px?(px-pos.avgCost)*pos.shares:null,stopDist=px?(px-stop)/px*100:null;
  const ab=actionBadge(pos,px);
  const entry=pos.entryDate||S.decisions[pos.ticker]?.entryDate;
  const held=entry?Math.round((Date.now()-new Date(entry))/86400000):'—';
  const sp=px?Math.min(100,Math.max(0,(px-stop)/(pos.avgCost-stop)*100)):50,sc=sp<20?'var(--red)':sp<40?'var(--orange)':'var(--green)';

function catalystBlock(p,ep,asIdea){

<div class="rev-box"><div class="rev-lbl">FDA / trial status</div><div class="rev-txt">${esc(p.reviewStatus)}</div></div>
${asIdea?'':keyDatesHtml(p)}
<div id="pb-${p.ticker}${asIdea?'-i':''}">${probBlock(p,ep,asIdea)}</div>
<div class="ped${S.editorOpen.has(p.ticker)?' open':''}" id="ped-${p.ticker}${asIdea?'-i':''}"><div class="ped-title">✏ Adjust my estimates</div>${editorHTML(p,ep,asIdea)}</div>
${asIdea?'':decisionNote(p)}`;

function probBlock(p,ep,asIdea){
  const ev=calcEV(ep),rr=rrOf(ep),s=scen(ep),px=refPx(p);
  const live=price(p.ticker)!=null;
  const tgt=pct=>px?fmtUSD(px*(1+pct/100)):'—';
  const amt=asIdea?(S.whatIf[p.ticker]??1000):null;
  const pnl=pct=>asIdea?fmtUSD(amt*pct/100,0):(px?fmtUSD((px*(1+pct/100)-p.avgCost)*p.shares):'—');
  const sid=p.ticker+(asIdea?'-i':'');
  const card=(cls,lbl,o)=>o?`<div class="scen ${cls}"><div class="scen-lbl">${lbl}</div><div class="scen-what">${esc(o.what)}</div><div class="scen-price ${o.pct>=0?'pos':'neg'}">${tgt(o.pct)}</div><div class="scen-row"><span class="k">Move</span><span class="${o.pct>=0?'pos':'neg'}">${fmtPct(o.pct,0)}</span></div><div class="scen-row"><span class="k">Chance</span><span>${Math.round(o.p*100)}%</span></div><div class="scen-row"><span class="k">${asIdea?'P&L on $':'My P&L'}</span><span class="blur-it ${o.pct>=0?'pos':'neg'}" data-wi="${sid}" data-pct="${o.pct}">${pnl(o.pct)}</span></div></div>`:'';
  return`<div class="prob-panel"><div>${probGaugeSVG(ep.myProbability)}</div><div><div class="ev-num ${ev>=0?'pos':'neg'}">${fmtPct(ev)}</div><div class="ev-lbl">Expected value: the average result if you made this exact bet many times</div><div class="tgt-row"><div class="tgt-item"><span class="lbl">Reward / risk</span><span class="val"><span class="rr-badge ${rrCls(rr)}">${rr.toFixed(2)}x</span></span></div><div class="tgt-item"><span class="lbl">Disagree?</span><span class="val"><button class="pencil-btn" onclick="toggleEditor('${p.ticker}',${asIdea})">✏ Edit odds</button></span></div></div></div></div>
<div class="thesis-lbl">Scenario planner${px?` · from ${live?'live':'reference'} price ${fmtUSD(px)}`:''}</div>
${!px?'<div class="ref-note">Price targets will appear when live prices load (↻). The % moves and chances below still apply.</div>':!live&&p.refDate?`<div class="ref-note">Live price unavailable, so targets use the ~${fmtUSD(p.refPrice)} reference price (${esc(p.refDate)}).</div>`:''}
${asIdea?`<div class="whatif">If I invest <input type="number" min="0" step="100" value="${amt}" oninput="onWhatIf('${p.ticker}',this.value)"> dollars, here is what each outcome means:</div>`:''}
<div class="scen-grid">${card('scen-bull','Bull case',s.bull)}${card('scen-base','Base case',s.base)}${card('scen-bear','Bear case',s.bear)}</div>`;
}
function onWhatIf(t,v){const n=Math.max(0,parseFloat(v)||0);S.whatIf[t]=n;lsSet('whatif',S.whatIf);document.querySelectorAll(`[data-wi="${t}-i"]`).forEach(el=>{el.textContent=fmtUSD(n*parseFloat(el.dataset.pct)/100,0);});}
function editorHTML(p,ep,asIdea){
  const t=p.ticker,a=asIdea?'true':'false';
  return`<div class="sl-row"><div class="sl-lbl"><span>Chance it works (approval / positive data)</span><span class="sl-val" id="slv-prob-${t}">${Math.round(ep.myProbability*100)}%</span></div><input type="range" min="0" max="100" step="5" value="${Math.round(ep.myProbability*100)}" id="sl-prob-${t}${asIdea?'-i':''}" oninput="onSlider('${t}',${a})"></div>
<div class="sl-row"><div class="sl-lbl"><span>Stock move if it works (bull)</span><span class="sl-val" id="slv-up-${t}">+${ep.upside}%</span></div><input type="range" min="5" max="500" step="5" value="${ep.upside}" id="sl-up-${t}${asIdea?'-i':''}" oninput="onSlider('${t}',${a})"></div>
<div class="sl-row"><div class="sl-lbl"><span>Stock drop if it fails (bear)</span><span class="sl-val" id="slv-dn-${t}">-${ep.downside}%</span></div><input type="range" min="5" max="95" step="5" value="${ep.downside}" id="sl-dn-${t}${asIdea?'-i':''}" oninput="onSlider('${t}',${a})"></div>
<div class="ped-actions"><button class="btn btn-p" onclick="saveProb('${t}',${a})">Save</button><button class="btn btn-s" onclick="toggleEditor('${t}',${a})">Cancel</button><button class="btn btn-d" onclick="resetProb('${t}')">Reset to my research</button></div>`;
}
function sliderVals(t,asIdea){const sx=asIdea?'-i':'';return{myProbability:parseInt(document.getElementById('sl-prob-'+t+sx)?.value||0)/100,upside:parseInt(document.getElementById('sl-up-'+t+sx)?.value||0),downside:parseInt(document.getElementById('sl-dn-'+t+sx)?.value||0)};}
function toggleEditor(t,asIdea){S.editorOpen.has(t)?S.editorOpen.delete(t):S.editorOpen.add(t);document.getElementById('ped-'+t+(asIdea?'-i':''))?.classList.toggle('open',S.editorOpen.has(t));}
function onSlider(t,asIdea){
  const v=sliderVals(t,asIdea);
  document.querySelectorAll(`#slv-prob-${t}`).forEach(e=>e.textContent=Math.round(v.myProbability*100)+'%');
  document.querySelectorAll(`#slv-up-${t}`).forEach(e=>e.textContent='+'+v.upside+'%');

function decisionNote(p){const d=S.decisions[p.ticker];return d?.finalDecision?`<div class="decision-note">📋 Your decision: <b>${esc(d.finalDecision)}</b> (${new Date(d.updatedAt).toLocaleDateString()})${d.exitApproval?` · win exit: ${esc(d.exitApproval)}`:''}${d.exitRejection?` · lose exit: ${esc(d.exitRejection)}`:''}</div>`:'';}

function viewPerformance(){
  const closed=S.closed;
  const r=c=>(c.exitPrice-c.entryPrice)/c.entryPrice*100;
  const wins=closed.filter(c=>c.outcome==='Win'),losses=closed.filter(c=>c.outcome==='Loss');
  const avgWin=wins.length?wins.reduce((s,c)=>s+r(c),0)/wins.length:null,avgLoss=losses.length?losses.reduce((s,c)=>s+r(c),0)/losses.length:null;
  const totalPnl=closed.reduce((s,c)=>s+(c.exitPrice-c.entryPrice)*c.shares,0);
  const rows=closed.length?closed.map((c,i)=>{const ret=r(c),held=c.entryDate&&c.exitDate?Math.round((new Date(c.exitDate)-new Date(c.entryDate))/86400000):'—';return`<tr><td style="color:var(--tc);font-weight:700;font-family:var(--mono)">${c.ticker}</td><td>${c.entryDate||'—'}</td><td>${c.exitDate||'—'}</td><td class="blur-it">${fmtUSD(c.entryPrice)} → ${fmtUSD(c.exitPrice)}</td><td class="${ret>=0?'pos':'neg'}">${fmtPct(ret)}</td><td style="color:${c.outcome==='Win'?'var(--green)':c.outcome==='Loss'?'var(--red)':'var(--yellow)'}">${esc(c.outcome)}</td><td>${Math.round((c.myProbability??0)*100)}%</td><td>${held}</td><td style="max-width:220px">${esc(c.notes||'—')}</td><td><button class="pencil-btn" title="Undo — move back to My Positions" onclick="undoClose(${i})">↩</button></td></tr>`;}).join(''):`<tr><td colspan="10" class="empty">No closed trades yet. When you sell, press <b>Log exit</b> on the card.</td></tr>`;
  return`<div class="page-h"><div><h1>Performance</h1><p>Closed trades and how well your probability estimates matched reality. Over time this tells you whether your “70%” really means 70%.</p></div></div>
<div class="sec"><div class="stat-grid" style="grid-template-columns:repeat(4,1fr)"><div class="stat"><div class="stat-val">${closed.length?Math.round(wins.length/closed.length*100)+'%':'—'}</div><div class="stat-lbl">Win rate (${wins.length}/${closed.length})</div></div><div class="stat"><div class="stat-val pos">${avgWin!=null?fmtPct(avgWin):'—'}</div><div class="stat-lbl">Average win</div></div><div class="stat"><div class="stat-val neg">${avgLoss!=null?fmtPct(avgLoss):'—'}</div><div class="stat-lbl">Average loss</div></div><div class="stat"><div class="stat-val blur-it ${totalPnl>=0?'pos':'neg'}">${closed.length?fmtUSD(totalPnl):'—'}</div><div class="stat-lbl">Total realized P&amp;L</div></div></div></div>
<div class="sec"><div class="sec-hd"><span class="sec-dot"></span><span class="sec-title">Closed trades</span></div><div class="box tbl-wrap" style="padding:6px 10px"><table><thead><tr><th>Ticker</th><th>Entry</th><th>Exit</th><th>Price</th><th>Return</th><th>Outcome</th><th>My odds</th><th>Days</th><th>Notes</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
${closed.length?`<div class="sec"><div class="sec-hd"><span class="sec-dot"></span><span class="sec-title">Were my odds right?</span></div><div class="box">${evCalibChart(closed)}</div></div>`:''}
<div class="sec">${riskPanel()}</div>`;
}
function evCalibChart(closed){
  const W=560,H=90,pad=30,slot=(W-pad*2)/closed.length,bw=Math.min(36,slot-8);
  let s=`<div class="note" style="margin-bottom:6px"><span style="color:#0ea5e9">■</span> my estimated odds · <span style="color:#22c55e">■</span> won / <span style="color:#ef4444">■</span> lost</div><svg viewBox="0 0 ${W} ${H+24}" style="width:100%;max-width:${W}px">`;
  closed.forEach((c,i)=>{const x=pad+i*slot+slot/2-bw/2,ph=(c.myProbability||.5)*(H-10),oh=c.outcome==='Win'?H-10:4;
    s+=`<rect x="${x}" y="${H-ph}" width="${bw/2-1}" height="${ph}" fill="rgba(14,165,233,.65)" rx="2"/><rect x="${x+bw/2+1}" y="${H-oh}" width="${bw/2-1}" height="${oh}" fill="${c.outcome==='Win'?'rgba(34,197,94,.75)':'rgba(239,68,68,.6)'}" rx="2"/><text x="${x+bw/2}" y="${H+13}" text-anchor="middle" fill="#8193ab" font-family="JetBrains Mono,monospace" font-size="8">${c.ticker}</text>`;});
  return s+'</svg>';
}
function riskPanel(){
  const pos=myPositions(),tc=totalCap(),active=pos.filter(isActive);
  if(!pos.length)return'';
  const byType={};pos.forEach(p=>{const k=isActive(p)?badgeLbl(p.catalystType):'Resolved — awaiting your exit';byType[k]=(byType[k]||0)+posVal(p);});
  const bt={lt30:0,lt60:0,lt90:0,gt90:0};active.forEach(p=>{const d=daysTo(p.catalystDate),v=posVal(p);if(d==null||d<0)return;if(d<30)bt.lt30+=v;else if(d<60)bt.lt60+=v;else if(d<90)bt.lt90+=v;else bt.gt90+=v;});
  const largest=pos.reduce((m,p)=>posVal(p)>posVal(m)?p:m,pos[0]);
  const sorted=active.filter(p=>daysTo(p.catalystDate)>=0).sort((a,b)=>daysTo(a.catalystDate)-daysTo(b.catalystDate));
  const warns=[];for(let i=0;i<sorted.length-1;i++){const g=daysTo(sorted[i+1].catalystDate)-daysTo(sorted[i].catalystDate);if(g<=7)warns.push(`⚠️ ${sorted[i].ticker} and ${sorted[i+1].ticker} decisions are ${g} day(s) apart, which concentrates binary risk.`);}
  const bar=(l,v,col)=>`<div class="risk-bar-row"><div class="rb-lbl"><span>${l}</span><span class="blur-it">${fmtUSD(v,0)} (${tc>0?(v/tc*100).toFixed(0):0}%)</span></div><div class="rb"><div class="rb-fill" style="width:${tc>0?Math.min(100,v/tc*100):0}%;background:${col}"></div></div></div>`;
  return`<div class="panels"><div class="panel"><div class="panel-hd"><div class="panel-title">Where my money is</div></div><div class="panel-body">${Object.entries(byType).map(([k,v])=>bar(k,v,k.startsWith('Resolved')?'var(--orange)':'var(--blue)')).join('')}<div class="note" style="margin-top:10px">Largest position: <b style="color:var(--tc)">${largest.ticker}</b> at <b class="blur-it">${tc>0?(posVal(largest)/tc*100).toFixed(0):0}%</b> of the catalyst book${tc>0&&posVal(largest)/tc>0.25?' <span style="color:var(--orange)">(above the 25% guideline)</span>':''}.</div></div></div>
<div class="panel"><div class="panel-hd"><div class="panel-title">When my live bets resolve</div></div><div class="panel-body">${warns.map(w=>`<div class="corr-warn">${w}</div>`).join('')}${bar('Under 30 days',bt.lt30,'var(--red)')}${bar('30–60 days',bt.lt60,'var(--orange)')}${bar('60–90 days',bt.lt90,'var(--yellow)')}${bar('90+ days',bt.gt90,'var(--green)')}</div></div></div>`;
}

function viewGuide(){
  const gl=[['PDUFA date','The deadline for the FDA to decide on a drug application. The single biggest dated catalyst in biotech.'],['CRL','Complete Response Letter: the FDA saying "not yet." It lists what has to be fixed. CMC-only and packaging CRLs are the most fixable kinds.'],['Class 1 / 2 resubmission','How long the FDA takes to review a fixed application: about 2 months (Class 1) or about 6 months (Class 2).'],['Priority Review','A 6-month review instead of 10, given to drugs that could be significant improvements.'],['AdCom','Advisory committee: outside experts vote on a drug. Not binding, but a negative vote (like CAPR\'s 9-3) is a big warning sign.'],['Major amendment','New data filed mid-review. The FDA usually extends the deadline by 3 months.'],['Accelerated Approval','Approval based on a "surrogate" marker (e.g., a protein level) before outcome data, with a confirmatory trial required.'],['Expected value (EV)','Average % result if you made the same bet many times: chance × gain + chance × loss across bull, base and bear. Positive = the odds favor you.'],['Reward / risk (R/R)','How much the stock rises if it works divided by how much it falls if it fails. 2x or more is good.'],['Stop','Your pre-decided price to sell if the trade goes wrong, so you don\'t have to decide in a panic.'],['Sell the news','When a stock falls even on good news because the good outcome was already priced in.'],['CMC','Chemistry, Manufacturing and Controls: the "can you make it reliably" part of an application.']];
  return`<div class="page-h"><div><h1>How Catalyst Lab works</h1><p>A plain-English guide to the dashboard and the rules behind each pick.</p></div></div>
<div class="guide-grid">
<div class="box"><div class="sec-hd"><span class="sec-dot"></span><span class="sec-title">Your routine</span></div><ol class="steps">
<li><b>Open Overview.</b> <span>The To-do list tells you what needs a decision today: catalysts that happened, decisions coming up, stops hit.</span></li>
<li><b>Before buying, read the idea card.</b> <span>Thesis → Scenarios → Trade plan → Risks. If you disagree with my odds, press “✏ Edit odds”, and every number updates.</span></li>
<li><b>Press “+ Track” after you buy.</b> <span>Enter shares and price. It moves to My Positions with live P&amp;L and stop tracking.</span></li>
<li><b>About 2 weeks before the date, run the Decision Framework.</b> <span>Write down your win exit and lose exit before the news hits.</span></li>
<li><b>After the event, press “Log exit”.</b> <span>Your result goes to Performance, so you can see whether your odds were well calibrated.</span></li>
</ol></div>
<div class="box"><div class="sec-hd"><span class="sec-dot" style="background:var(--green)"></span><span class="sec-title">Selection rules for every idea</span></div><ol class="steps">
<li><b>A dated, binary catalyst.</b> <span>A PDUFA date or a scheduled trial readout, ideally within about 4 months. No “someday” stories (that's why NVAX now gets flagged).</span></li>
<li><b>Cash past the event.</b> <span>The company must not need to raise money right before the decision.</span></li>
<li><b>Clean review so far.</b> <span>No negative AdCom, no surprise extensions. Prior CRLs are allowed only if the issue was fixable (manufacturing or packaging).</span></li>
<li><b>Positive expected value.</b> <span>Using honest bull/base/bear odds, not hopes. Low-odds bets need R/R of 2x or more. High-odds approvals (80%+) can work with R/R below 1x because they usually win.</span></li>
<li><b>Size for survival.</b> <span>No single position above 25% of the catalyst book, and smaller sizes when decisions cluster.</span></li>
</ol></div>
<div class="box" style="grid-column:1/-1"><div class="sec-hd"><span class="sec-dot" style="background:var(--purple)"></span><span class="sec-title">Glossary</span></div><div class="gl">${gl.map(([a,b])=>`<div class="term">${a}</div><div>${b}</div>`).join('')}</div></div>
<div class="box" style="grid-column:1/-1"><div class="sec-hd"><span class="sec-dot" style="background:var(--tm)"></span><span class="sec-title">Keyboard &amp; data</span></div><div class="note"><span class="key">1</span>–<span class="key">6</span> switch tabs · <span class="key">R</span> refresh prices · <span class="key">?</span> shortcuts · <span class="key">Esc</span> close. Your notes, checklist, tracked trades and edits are saved in this browser only. Back them up with ⚙ → Export. Research data was refreshed ${fmtDate(CONFIG.asOf)}. Probabilities are personal estimates, not financial advice.</div></div>
</div>`;
}

// =====================================================================
// MODALS
// =====================================================================
function showModal(html){const o=document.getElementById('modal-ov');o.innerHTML=`<div class="modal"><button class="modal-close" onclick="closeModal()">✕</button>${html}</div>`;o.classList.remove('hidden');}
function closeModal(){const o=document.getElementById('modal-ov');o.classList.add('hidden');o.innerHTML='';}
function openDecision(t){
  const pos=myPositions().find(p=>p.ticker===t);if(!pos)return;
  const ep=effPos(pos),px=price(t),d=S.decisions[t]||{},posV=(px??pos.avgCost)*pos.shares,tc=totalCap(),pct=tc>0?(posV/tc*100):0;
  const runUp=px?(px-pos.avgCost)/pos.avgCost*100:null,s=scen(ep);
  const cols={'Hold Full':'var(--blue)','Reduce Size':'var(--yellow)','Exit Before Event':'var(--red)','Add':'var(--green)'};
  showModal(`<div class="modal-title">📋 Decision Framework: ${t} · ${fmtDate(pos.catalystDate)}</div>
<div class="dstep"><div class="dstep-num">Step 1</div><div class="dstep-q">If it's approved / positive, at what price do I sell (some or all)?</div><input class="d-input" value="${esc(d.exitApproval||'')}" placeholder="e.g. sell half at ${px?fmtUSD(px*(1+ep.upside/100)):'+X%'}" oninput="saveDecision('${t}',{exitApproval:this.value})"></div>
<div class="dstep"><div class="dstep-num">Step 2</div><div class="dstep-q">If it fails, what do I do?</div><input class="d-input" value="${esc(d.exitRejection||'')}" placeholder="e.g. sell everything at the open" oninput="saveDecision('${t}',{exitRejection:this.value})"></div>
<div class="dstep"><div class="dstep-num">Step 3</div><div class="dstep-q">Can I live with the bear case?</div><div class="d-info">Position <b class="blur-it">${fmtUSD(posV)}</b> (${pct.toFixed(1)}% of catalyst book). In the bear case (${fmtPct(s.bear.pct,0)}) you'd lose about <b class="blur-it">${fmtUSD(posV*s.bear.pct/100)}</b>.</div>${pct>25?`<div class="d-warn">⚠️ Above the 25% concentration guideline.</div>`:''}</div>
<div class="dstep"><div class="dstep-num">Step 4</div><div class="dstep-q">Checked for FDA news (AdCom, extension, info requests) in the last 7 days?</div><div class="toggle-row">${['Yes','No'].map(v=>`<button class="tog-btn${d.fdaCheck===v?' active':''}" onclick="saveDecision('${t}',{fdaCheck:'${v}'});this.parentElement.querySelectorAll('.tog-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${v}</button>`).join('')}</div></div>
<div class="dstep"><div class="dstep-num">Step 5</div><div class="dstep-q">Has a run-up changed the math?</div>${runUp!=null&&runUp>20?`<div class="d-warn">📈 Up ${fmtPct(runUp)} from your cost. Part of the win may already be priced in, so consider trimming.</div>`:`<div class="d-info">Change from your cost: ${runUp!=null?fmtPct(runUp):'—'}. Expected value now: ${fmtPct(calcEV(ep))}.</div>`}</div>
<div class="dstep"><div class="dstep-num">Step 6: final decision</div><div class="choice-grid">${Object.keys(cols).map(c=>`<button class="choice-btn${d.finalDecision===c?' chosen':''}" style="color:${cols[c]};border-color:currentColor" onclick="saveDecision('${t}',{finalDecision:'${c}'});this.parentElement.querySelectorAll('.choice-btn').forEach(b=>b.classList.remove('chosen'));this.classList.add('chosen')">${c}</button>`).join('')}</div></div>
<div style="display:flex;gap:8px"><button class="btn btn-p" onclick="closeModal();renderAll();showToast('✅ Decision saved for ${t}')">Done</button></div>`);
}
function openClose(t,preset){
  const pos=myPositions().find(p=>p.ticker===t);if(!pos)return;
  const px=price(t);
  showModal(`<div class="modal-title">✅ Log exit: ${t}</div>
<div class="note" style="margin-bottom:12px">This moves ${t} from My Positions to Performance. You can undo it there.</div>
<div class="frow"><div class="dstep"><div class="dstep-q">Exit price</div><input class="d-input" id="close-price" type="number" step="0.0001" value="${px?px.toFixed(4).replace(/0+$/,'').replace(/\.$/,''):''}" placeholder="price you sold at"></div><div class="dstep"><div class="dstep-q">Exit date</div><input class="d-input" id="close-date" type="date" value="${new Date().toISOString().split('T')[0]}"></div></div>
<div class="dstep"><div class="dstep-q">Outcome</div><div class="toggle-row">${['Win','Loss','Mixed'].map(o=>`<button class="tog-btn${preset===o?' active':''}" onclick="this.parentElement.querySelectorAll('.tog-btn').forEach(b=>b.classList.remove('active'));this.classList.add('active');document.getElementById('close-outcome').value='${o}'">${o}</button>`).join('')}<input type="hidden" id="close-outcome" value="${preset||''}"></div></div>
<div class="dstep"><div class="dstep-q">What happened? What did you learn?</div><textarea class="d-input" id="close-notes" rows="3" style="font-family:var(--body)">${esc(pos.outcome||'')}</textarea></div>
<div style="display:flex;gap:8px"><button class="btn btn-p" onclick="confirmClose('${t}')">Log exit</button><button class="btn btn-s" onclick="closeModal()">Cancel</button></div>`);
}
function confirmClose(t){
  const ep=parseFloat(document.getElementById('close-price')?.value),outcome=document.getElementById('close-outcome')?.value,notes=document.getElementById('close-notes')?.value;
  if(!ep||ep<=0){showToast('Enter the price you sold at');return;}
  if(!outcome){showToast('Pick Win, Loss or Mixed');return;}
  const pos=myPositions().find(p=>p.ticker===t);if(!pos)return;
  S.closed.push({ticker:t,entryDate:pos.entryDate||S.decisions[t]?.entryDate||null,exitDate:document.getElementById('close-date')?.value||new Date().toISOString().split('T')[0],entryPrice:pos.avgCost,exitPrice:ep,shares:pos.shares,outcome,notes:notes||'',myProbability:effPos(pos).myProbability});
  lsSet('closed',S.closed);closeModal();renderAll();showToast(`${t} logged in Performance`);
}
function undoClose(i){const c=S.closed[i];if(!c||!confirm(`Move ${c.ticker} back to My Positions?`))return;S.closed.splice(i,1);lsSet('closed',S.closed);renderAll();}
function openTrack(t){
  const i=CONFIG.ideas.find(x=>x.ticker===t);if(!i)return;const px=price(t)??i.refPrice;
  showModal(`<div class="modal-title">+ Track ${t} as a position</div>
<div class="note" style="margin-bottom:12px">Enter what you actually bought. ${t} will appear in My Positions with live P&amp;L, a stop, the checklist and the journal. Saved in this browser.</div>
<div class="frow"><div class="dstep"><div class="dstep-q">Shares</div><input class="d-input" id="tr-sh" type="number" step="any" min="0" placeholder="e.g. 10"></div><div class="dstep"><div class="dstep-q">Average cost</div><input class="d-input" id="tr-px" type="number" step="any" min="0" value="${px?px.toFixed(2):''}"></div></div>
<div class="frow"><div class="dstep"><div class="dstep-q">Buy date</div><input class="d-input" id="tr-dt" type="date" value="${new Date().toISOString().split('T')[0]}"></div><div class="dstep"><div class="dstep-q">Stop loss %</div><input class="d-input" id="tr-stop" type="number" min="5" max="95" value="${Math.abs(parseFloat(i.plan?.stop)||30)}"></div></div>
<div style="display:flex;gap:8px"><button class="btn btn-pu" onclick="confirmTrack('${t}')">Start tracking</button><button class="btn btn-s" onclick="closeModal()">Cancel</button></div>`);
}
function confirmTrack(t){
  const sh=parseFloat(document.getElementById('tr-sh').value),px=parseFloat(document.getElementById('tr-px').value),dt=document.getElementById('tr-dt').value,stop=parseFloat(document.getElementById('tr-stop').value)||30;
  if(!(sh>0)||!(px>0)){showToast('Enter shares and cost');return;}
  S.tracked[t]={ticker:t,shares:sh,avgCost:px,entryDate:dt,stopPct:Math.min(.95,Math.max(.05,stop/100))};lsSet('tracked',S.tracked);
  saveDecision(t,{entryDate:dt});
  closeModal();openItemPos(t);showToast(`${t} added to My Positions`);
}
function untrack(t){if(!confirm(`Stop tracking ${t}? (Use “Log exit” instead if you sold it.)`))return;delete S.tracked[t];lsSet('tracked',S.tracked);renderAll();}

// =====================================================================
// SETTINGS + SHORTCUTS
// =====================================================================
function toggleSettings(){document.getElementById('sett-panel').classList.toggle('open');renderSettings();}
function renderSettings(){
  const ts=S.lastFetch?S.lastFetch.toLocaleString():'never';
  document.getElementById('sett-panel').innerHTML=`<button class="sett-close" onclick="document.getElementById('sett-panel').classList.remove('open')">✕</button><div class="sett-title">⚙ Settings</div>
<div class="sett-row"><div><div class="sett-lbl">Privacy mode</div><div class="sett-desc">Blur dollar amounts</div></div><label class="tog"><input type="checkbox" ${S.settings.privacyMode?'checked':''} onchange="S.settings.privacyMode=this.checked;saveSettings();document.body.classList.toggle('privacy',this.checked)"><span class="tog-sl"></span></label></div>
<div class="sett-row"><div class="sett-lbl">Position card opens on</div><select class="sett-sel" onchange="S.settings.defaultTab=this.value;saveSettings();S.activeTabs={};renderAll()">${[['overview','Position'],['scen','Catalyst'],['thesis','Thesis']].map(([v,l])=>`<option value="${v}" ${S.settings.defaultTab===v?'selected':''}>${l}</option>`).join('')}</select></div>
<div class="sett-actions"><button class="btn btn-s" onclick="exportData()">📤 Export my data (JSON)</button><button class="btn btn-s" onclick="document.getElementById('import-file').click()">📥 Import data (JSON)</button><input type="file" id="import-file" accept=".json" onchange="handleImport(this)"><button class="btn btn-s" onclick="manualRefresh()">↻ Refresh prices</button><button class="btn btn-d" onclick="if(confirm('Reset all probability edits back to the research estimates?')){Object.keys(S.overrides).forEach(t=>{try{localStorage.removeItem(LS+'override_'+t)}catch{}});S.overrides={};renderAll();showToast('Estimates reset')}">Reset all odds edits</button></div>
<div class="sett-version">CATALYST LAB v2.0<br>Research as of ${fmtDate(CONFIG.asOf)}<br>Last price refresh: ${ts}<br>${myPositions().length} positions · ${CONFIG.ideas.length} ideas · ${S.closed.length} closed</div>`;
}
function handleImport(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>importData(e.target.result);r.readAsText(f);}
function renderShortcuts(){
  document.getElementById('shorts-ov').innerHTML=`<div class="shorts-box"><div class="shorts-title">Keyboard shortcuts</div>${[['1–6','Switch tab (Overview … Guide)'],['R','Refresh prices'],['?','Show this overlay'],['Esc','Close any overlay']].map(([k,d])=>`<div class="sk-row"><span class="key">${k}</span><span style="color:var(--tm)">${d}</span></div>`).join('')}<div style="text-align:center;margin-top:12px"><button class="btn btn-s" onclick="document.getElementById('shorts-ov').classList.add('hidden')">Close</button></div></div>`;
}
document.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.key==='Escape'){document.getElementById('shorts-ov').classList.add('hidden');closeModal();document.getElementById('sett-panel').classList.remove('open');return;}
  if(e.key==='?'){renderShortcuts();document.getElementById('shorts-ov').classList.remove('hidden');return;}
  if(e.key.toLowerCase()==='r'){manualRefresh();return;}
  if(e.key>='1'&&e.key<=String(VIEWS.length)){setView(VIEWS[parseInt(e.key)-1][0]);}
});
document.getElementById('modal-ov').addEventListener('click',e=>{if(e.target.id==='modal-ov')closeModal();});

// =====================================================================
// MAIN
// =====================================================================
function renderAll(){
  renderNav();
  const v=S.settings.view;
  const fn={overview:viewOverview,positions:viewPositions,ideas:viewIdeas,calendar:viewCalendar,performance:viewPerformance,guide:viewGuide}[v]||viewOverview;
  document.getElementById('view-root').innerHTML=fn();
  document.body.classList.toggle('privacy',!!S.settings.privacyMode);
}
function startClock(){
  S.clockTid=setInterval(()=>{const el=document.querySelector('.nav-r .clock');if(!el)return;
    const ct=new Intl.DateTimeFormat('en-US',{timeZone:CONFIG.timezone,month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:true}).format(new Date());
    el.textContent=ct+' CT · ↺'+(S.nextRefreshAt?Math.max(0,Math.round((S.nextRefreshAt-Date.now())/1000)):0)+'s';},1000);
}
async function init(){
  loadLS();
  const c=lsGet('prices',null);if(c?.prices){S.prices=c.prices;S.staleData=true;S.lastFetch=new Date(c.ts);}
  renderAll();
  await fetchPrices();renderAll();scheduleRefresh();startClock();
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
